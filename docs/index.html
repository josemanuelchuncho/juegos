<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fuegos artificiales - Cielo nocturno</title>
  <style>
    html,body { height:100%; margin:0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#000; }
    .stage { position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; background: radial-gradient(ellipse at top, #001a3d 0%, #000814 55%, #000000 100%); cursor:crosshair; }
    canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
    .horizon { position:absolute; left:0; right:0; bottom:0; height:22%; pointer-events:none;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(10,20,45,0.35) 60%, rgba(0,0,0,0.8) 100%); }
    /* UI */
    .controls { position:absolute; left:50%; transform:translateX(-50%); bottom:40px; z-index:10; cursor:default; }
    button#launchBtn { background:linear-gradient(180deg,#ff8a00,#ff4d00); color:white; border:0; padding:14px 22px; font-size:18px; border-radius:10px; cursor:pointer;
      box-shadow:0 6px 18px rgba(255,77,0,0.25); transition: transform .12s ease, box-shadow .2s ease; animation: pulse 2.4s ease-in-out infinite; }
    button#launchBtn:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(255,77,0,0.45); }
    button#launchBtn:active { transform:translateY(1px) scale(0.97); }
    @keyframes pulse { 0%,100% { box-shadow:0 6px 18px rgba(255,77,0,0.25); } 50% { box-shadow:0 6px 30px rgba(255,120,0,0.6); } }
    .hint { text-align:center; color:#cbd5e1; font-size:13px; margin-top:8px; text-shadow:0 1px 2px rgba(0,0,0,0.7); }
    @media (prefers-reduced-motion: reduce) { button#launchBtn { animation:none; } }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="stars"></canvas>
    <canvas id="fx"></canvas>
    <canvas id="ui"></canvas>
    <div class="horizon"></div>

    <div class="controls">
      <button id="launchBtn">presione aqui</button>
      <div class="hint">Presiona el botón o toca el cielo</div>
    </div>
  </div>

<script>
// Mensajes (siguen el orden pedido)
const messages = [
  'buenos dias.',
  'ten un lindo dia.',
  'te extraño.',
  'eres increible.',
  'un corazon'
];
let msgIndex = 0;
function nextMessage(){
  const m = messages[msgIndex] || '';
  msgIndex = (msgIndex + 1) % messages.length;
  return m;
}

// ---------- Canvases (con soporte de pantallas de alta densidad) ----------
const stage = document.getElementById('stage');
const launchBtn = document.getElementById('launchBtn');
const starsCanvas = document.getElementById('stars');
const fxCanvas = document.getElementById('fx');
const uiCanvas = document.getElementById('ui');
const sCtx = starsCanvas.getContext('2d');
const fCtx = fxCanvas.getContext('2d');
const uCtx = uiCanvas.getContext('2d');

let W = 0, H = 0, DPR = 1;
function resize(){
  W = stage.clientWidth; H = stage.clientHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  for(const [c, ctx] of [[starsCanvas,sCtx],[fxCanvas,fCtx],[uiCanvas,uCtx]]){
    c.width = Math.round(W*DPR); c.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  buildStars();
}

const rand = (a,b)=> a + Math.random()*(b-a);
const easeOutCubic = t => 1 - Math.pow(1-t, 3);
const easeOutBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };

// ---------- Estrellas y estrellas fugaces ----------
let stars = [];
function buildStars(){
  const n = Math.min(400, Math.floor((W*H)/3500));
  stars = [];
  for(let i=0;i<n;i++){
    stars.push({ x: Math.random()*W, y: Math.random()*H*0.8, r: Math.random()*1.2+0.2,
      a: Math.random()*0.6+0.25, tw: rand(0.6,2.5), t: Math.random()*Math.PI*2,
      hue: Math.random()<0.15 ? rand(190,230) : (Math.random()<0.1 ? rand(30,50) : 0) });
  }
}
const shooting = [];
let skyFlash = 0; // iluminación global del cielo por explosiones

function drawStars(dt){
  sCtx.clearRect(0,0,W,H);
  // resplandor del cielo cuando explota algo
  if(skyFlash > 0.002){
    sCtx.fillStyle = `rgba(120,140,200,${skyFlash*0.12})`;
    sCtx.fillRect(0,0,W,H);
    skyFlash *= Math.exp(-4*dt);
  }
  for(const s of stars){
    s.t += s.tw*dt;
    const a = Math.max(0, Math.min(1, s.a + Math.sin(s.t)*0.3));
    sCtx.fillStyle = s.hue ? `hsla(${s.hue},80%,85%,${a})` : `rgba(255,255,255,${a})`;
    sCtx.beginPath(); sCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); sCtx.fill();
  }
  // estrellas fugaces ocasionales
  if(Math.random() < dt*0.12){
    const ang = rand(0.25,0.55);
    shooting.push({x: rand(W*0.1, W*0.9), y: rand(0, H*0.35), vx: Math.cos(ang)*rand(500,800)*(Math.random()<0.5?-1:1), vy: Math.sin(ang)*rand(500,800), life: rand(0.5,0.9), age:0});
  }
  for(let i=shooting.length-1;i>=0;i--){
    const s = shooting[i];
    s.age += dt; s.x += s.vx*dt; s.y += s.vy*dt;
    const k = 1 - s.age/s.life;
    if(k <= 0){ shooting.splice(i,1); continue; }
    const g = sCtx.createLinearGradient(s.x, s.y, s.x - s.vx*0.12, s.y - s.vy*0.12);
    g.addColorStop(0, `rgba(255,255,255,${k})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    sCtx.strokeStyle = g; sCtx.lineWidth = 1.5; sCtx.lineCap = 'round';
    sCtx.beginPath(); sCtx.moveTo(s.x, s.y); sCtx.lineTo(s.x - s.vx*0.12, s.y - s.vy*0.12); sCtx.stroke();
  }
}

// ---------- Partículas (física en píxeles/segundo) ----------
const GRAVITY = 110;
const MAX_PARTICLES = 4000;
const particles = [];

class Particle{
  constructor(o){
    this.x = o.x; this.y = o.y; this.px = o.x; this.py = o.y;
    this.vx = o.vx; this.vy = o.vy;
    this.hue = o.hue; this.sat = o.sat ?? 100; this.light = o.light ?? 62;
    this.life = o.life; this.age = 0;
    this.size = o.size ?? 2;
    this.drag = o.drag ?? 1.5;          // resistencia del aire
    this.grav = o.grav ?? 1;            // multiplicador de gravedad
    this.flicker = o.flicker ?? false;  // titileo al apagarse
    this.glitter = o.glitter ?? false;  // suelta chispitas
    this.white = o.white ?? 0;          // tiempo inicial en blanco (núcleo caliente)
  }
  update(dt){
    this.px = this.x; this.py = this.y;
    const d = Math.exp(-this.drag*dt);
    this.vx *= d; this.vy *= d;
    this.vy += GRAVITY*this.grav*dt;
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.age += dt;
    if(this.glitter && Math.random() < dt*14 && particles.length < MAX_PARTICLES){
      particles.push(new Particle({x:this.x, y:this.y, vx:rand(-15,15), vy:rand(-5,20), hue:45, sat:100, light:85, life:rand(0.2,0.5), size:0.9, drag:3, grav:0.4}));
    }
  }
  get dead(){ return this.age >= this.life; }
  draw(ctx){
    const t = this.age/this.life;
    let a = t < 0.7 ? 1 : 1 - (t-0.7)/0.3;
    if(this.flicker && t > 0.5) a *= Math.random() < 0.5 ? 0.25 : 1;
    if(a <= 0) return;
    const light = this.age < this.white ? 95 : this.light;
    ctx.strokeStyle = `hsla(${this.hue},${this.sat}%,${light}%,${a})`;
    ctx.lineWidth = this.size * (1 - t*0.5);
    ctx.beginPath(); ctx.moveTo(this.px, this.py); ctx.lineTo(this.x, this.y); ctx.stroke();
  }
}

// ---------- Cohetes ----------
const rockets = [];
const flashes = [];
const labels = [];

const BURSTS = ['peony','ring','willow','double','crossette'];

class Rocket{
  constructor(sx, sy, tx, ty, message){
    this.x = sx; this.y = sy; this.message = message;
    // velocidad inicial para llegar justo a la altura objetivo (desacelera de forma natural)
    const h = Math.max(80, sy - ty);
    this.g = 260;
    this.vy = -Math.sqrt(2*this.g*h);
    const tUp = -this.vy/this.g;
    this.vx = (tx - sx)/tUp;
    this.hue = Math.floor(rand(0,360));
    this.type = message === '❤' ? 'heart' : BURSTS[Math.floor(Math.random()*BURSTS.length)];
    this.wobble = Math.random()*Math.PI*2;
    this.done = false;
  }
  update(dt){
    const px = this.x, py = this.y;
    this.vy += this.g*dt;
    this.wobble += dt*18;
    this.x += (this.vx + Math.sin(this.wobble)*12)*dt;
    this.y += this.vy*dt;
    // estela de chispas
    const n = 3;
    for(let i=0;i<n;i++){
      const k = i/n;
      particles.push(new Particle({x: px + (this.x-px)*k, y: py + (this.y-py)*k, vx: rand(-20,20), vy: rand(10,60),
        hue: 35, sat: 100, light: rand(55,80), life: rand(0.25,0.6), size: rand(0.8,1.6), drag: 2.5, grav: 0.3, flicker:true}));
    }
    if(this.vy >= -25) this.explode();
  }
  draw(ctx){
    ctx.fillStyle = 'rgba(255,240,210,1)';
    ctx.beginPath(); ctx.arc(this.x, this.y, 2.2, 0, Math.PI*2); ctx.fill();
    const g = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,10);
    g.addColorStop(0,'rgba(255,200,120,0.6)'); g.addColorStop(1,'rgba(255,200,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI*2); ctx.fill();
  }
  explode(){
    this.done = true;
    const {x, y, hue} = this;
    const scale = Math.min(1.25, Math.max(0.7, Math.min(W,H)/700));
    const add = o => { if(particles.length < MAX_PARTICLES) particles.push(new Particle(o)); };

    switch(this.type){
      case 'heart': {
        const n = 140;
        for(let i=0;i<n;i++){
          const t = (i/n)*Math.PI*2;
          const hx = 16*Math.pow(Math.sin(t),3);
          const hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
          const s = 11*scale*rand(0.97,1.03);
          add({x,y, vx:hx*s, vy:hy*s, hue: rand(340,360), light: rand(55,68), life: rand(2.0,2.6), size:2.4, drag:1.9, grav:0.25, white:0.12, flicker:true});
        }
        // relleno suave
        for(let i=0;i<60;i++){
          const t = Math.random()*Math.PI*2, r = Math.random()*0.8;
          const hx = 16*Math.pow(Math.sin(t),3)*r;
          const hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))*r;
          add({x,y, vx:hx*11*scale, vy:hy*11*scale, hue: 330, light: 75, life: rand(1.4,2.0), size:1.4, drag:1.9, grav:0.25, flicker:true});
        }
        break;
      }
      case 'ring': {
        const n = 90, tilt = rand(0.35,1), rot = rand(0,Math.PI);
        for(let i=0;i<n;i++){
          const a = (i/n)*Math.PI*2;
          let vx = Math.cos(a)*240*scale, vy = Math.sin(a)*240*scale*tilt;
          const c = Math.cos(rot), s = Math.sin(rot);
          add({x,y, vx: vx*c - vy*s, vy: vx*s + vy*c, hue, life: rand(1.5,1.9), size:2.2, drag:1.6, white:0.1});
        }
        for(let i=0;i<40;i++){
          const a = Math.random()*Math.PI*2, sp = rand(20,90)*scale;
          add({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, hue:(hue+180)%360, life: rand(1,1.4), size:1.6, drag:1.6, flicker:true});
        }
        break;
      }
      case 'willow': {
        const n = 130;
        for(let i=0;i<n;i++){
          const a = Math.random()*Math.PI*2, sp = Math.sqrt(Math.random())*230*scale;
          add({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, hue: 40, sat: 90, light: 58, life: rand(2.6,3.4), size:1.8, drag:2.4, grav:0.9, glitter: Math.random()<0.35, flicker:true});
        }
        break;
      }
      case 'double': {
        const h2 = (hue + rand(120,200))%360;
        for(let i=0;i<110;i++){
          const a = Math.random()*Math.PI*2, sp = rand(0.85,1)*260*scale;
          add({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, hue, life: rand(1.6,2.1), size:2.2, drag:1.7, white:0.1});
        }
        for(let i=0;i<60;i++){
          const a = Math.random()*Math.PI*2, sp = rand(0.85,1)*130*scale;
          add({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, hue:h2, life: rand(1.4,1.8), size:2, drag:1.7, flicker:true});
        }
        break;
      }
      case 'crossette': {
        // estrellas que se dividen en cruces
        for(let i=0;i<14;i++){
          const a = (i/14)*Math.PI*2 + rand(-0.1,0.1), sp = 200*scale;
          const p = new Particle({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, hue, life: 0.75, size:2.6, drag:1.4, white:0.1});
          p.onDeath = () => {
            for(let k=0;k<4;k++){
              const b = a + k*Math.PI/2 + Math.PI/4, s2 = 110*scale;
              add({x:p.x, y:p.y, vx:Math.cos(b)*s2 + p.vx*0.3, vy:Math.sin(b)*s2 + p.vy*0.3, hue:(hue+30)%360, life: rand(0.9,1.3), size:1.8, drag:1.8, flicker:true});
            }
          };
          if(particles.length < MAX_PARTICLES) particles.push(p);
        }
        break;
      }
      default: { // peony
        const n = 150;
        for(let i=0;i<n;i++){
          const a = Math.random()*Math.PI*2;
          // distribución esférica proyectada: más densidad en el borde
          const sp = Math.sqrt(1 - Math.pow(Math.random(),2))*270*scale;
          add({x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, hue: hue + rand(-15,15), life: rand(1.6,2.2), size:2.1, drag:1.6, white:0.12, flicker: Math.random()<0.4});
        }
      }
    }
    // destello central
    flashes.push({x, y, age:0, life:0.35, r: 140*scale, hue: this.type==='heart' ? 350 : hue});
    skyFlash = Math.min(1, skyFlash + 0.6);
    if(this.message) labels.push({x, y, text:this.message, age:0, life: this.message==='❤' ? 3.2 : 3.0, heart: this.message==='❤'});
  }
}

// ---------- Bucle principal ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;

  drawStars(dt);

  // estelas: desvanece lo anterior en vez de borrar todo
  fCtx.globalCompositeOperation = 'destination-out';
  fCtx.fillStyle = 'rgba(0,0,0,0.22)';
  fCtx.fillRect(0,0,W,H);
  fCtx.globalCompositeOperation = 'lighter';
  fCtx.lineCap = 'round';

  for(let i=rockets.length-1;i>=0;i--){
    const r = rockets[i];
    r.update(dt);
    if(r.done) rockets.splice(i,1); else r.draw(fCtx);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.update(dt);
    if(p.dead || p.y > H + 20){
      if(p.onDeath && p.dead) p.onDeath();
      particles[i] = particles[particles.length-1]; particles.pop();
    } else p.draw(fCtx);
  }
  for(let i=flashes.length-1;i>=0;i--){
    const f = flashes[i];
    f.age += dt;
    const k = 1 - f.age/f.life;
    if(k <= 0){ flashes.splice(i,1); continue; }
    const g = fCtx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    g.addColorStop(0, `hsla(${f.hue},100%,90%,${0.55*k})`);
    g.addColorStop(0.3, `hsla(${f.hue},100%,70%,${0.18*k})`);
    g.addColorStop(1, 'hsla(0,0%,0%,0)');
    fCtx.fillStyle = g; fCtx.beginPath(); fCtx.arc(f.x,f.y,f.r,0,Math.PI*2); fCtx.fill();
  }
  fCtx.globalCompositeOperation = 'source-over';

  drawLabels(dt);
  requestAnimationFrame(loop);
}

// Mensajes: aparecen con rebote, flotan hacia arriba y se desvanecen
function drawLabels(dt){
  uCtx.clearRect(0,0,W,H);
  const base = Math.max(20, Math.min(40, W/22));
  for(let i=labels.length-1;i>=0;i--){
    const l = labels[i];
    l.age += dt;
    if(l.age > l.life){ labels.splice(i,1); continue; }
    const appear = Math.min(1, l.age/0.5);
    const fadeStart = l.life - 0.8;
    const alpha = Math.min(appear, l.age > fadeStart ? 1 - (l.age-fadeStart)/0.8 : 1);
    const scale = 0.5 + 0.5*easeOutBack(appear);
    const rise = easeOutCubic(Math.min(1, l.age/l.life))*30;
    const size = l.heart ? base*2.2 : base;
    const y = Math.max(size, Math.min(H*0.7, l.y)) - rise;
    const x = Math.max(size*3, Math.min(W - size*3, l.x));
    uCtx.save();
    uCtx.translate(x, y);
    const beat = l.heart ? 1 + 0.08*Math.max(0, Math.sin(l.age*9)) : 1;
    uCtx.scale(scale*beat, scale*beat);
    uCtx.globalAlpha = Math.max(0, alpha);
    uCtx.font = `600 ${size}px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif`;
    uCtx.textAlign = 'center'; uCtx.textBaseline = 'middle';
    uCtx.shadowColor = l.heart ? 'rgba(255,60,110,0.9)' : 'rgba(255,190,90,0.85)';
    uCtx.shadowBlur = 22;
    uCtx.fillStyle = l.heart ? '#ff4d7a' : '#fff';
    uCtx.fillText(l.text, 0, 0);
    uCtx.shadowBlur = 0;
    uCtx.fillText(l.text, 0, 0);
    uCtx.restore();
  }
}

// ---------- Lanzamiento ----------
function launch(tx, ty, sx){
  const msg = nextMessage();
  const text = msg === 'un corazon' ? '❤' : msg;
  sx = sx ?? W/2 + rand(-60,60);
  rockets.push(new Rocket(sx, H + 5, tx, ty, text));
}

launchBtn.addEventListener('click', (e)=>{
  e.stopPropagation();
  launch(rand(W*0.15, W*0.85), rand(H*0.12, H*0.42));
  // pequeños acompañantes sin mensaje para dar más espectáculo
  if(Math.random() < 0.5){
    setTimeout(()=>{
      const r = new Rocket(rand(W*0.2,W*0.8), H+5, rand(W*0.1,W*0.9), rand(H*0.15,H*0.45), '');
      rockets.push(r);
    }, rand(250,600));
  }
});

// tocar el cielo lanza un cohete hacia ese punto
stage.addEventListener('click', (e)=>{
  if(e.target.closest('.controls')) return;
  const rect = stage.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  launch(x, Math.min(y, H*0.8), x + rand(-40,40));
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
